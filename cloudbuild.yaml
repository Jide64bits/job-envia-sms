steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/jobs/${_JOB_NAME}:latest', '.']
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/jobs/${_JOB_NAME}:latest'
substitutions:
  _REGION: us-central1
  _JOB_NAME: envia-sms
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
